<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Day in Tokyo</title>
  <style>
    :root {
      --bg: #fdf8f4;
      --text: #1f1d1b;
      --muted: #6b645d;
      --accent: #c8102e;
      --card: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    main {
      max-width: 560px;
      background: var(--card);
      border-radius: 16px;
      padding: 40px 32px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
      text-align: center;
    }
    .sun {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: var(--accent);
      margin: 0 auto 24px;
    }
    h1 { margin: 0 0 12px; font-size: 2rem; }
    p { color: var(--muted); line-height: 1.6; margin: 0 0 24px; }
    button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 12px 28px;
      font-size: 1rem;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    small { display: block; margin-top: 16px; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <div class="sun" aria-hidden="true"></div>
    <h1>A Day in Tokyo</h1>
    <p>Answer a few quick questions and get a personalized one-day itinerary for Tokyo.</p>
    <button disabled>Start the questionnaire</button>
    <small>Coming soon</small>
  </main>
</body>
</html>
